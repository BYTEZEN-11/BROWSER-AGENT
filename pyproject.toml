[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langraph-browser-agent"
version = "1.0.0"
description = "Vision-enabled web browsing agent powered by LLMs"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Langraph Browser Agent Contributors", email = "infect3dlab@gmail.com"}
]
keywords = ["browser", "automation", "llm", "langchain", "langgraph", "playwright", "ai-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.11.0,<4.0.0",
    "annotated-types>=0.7.0,<1.0.0",
    "anyio>=4.0.0,<5.0.0",
    "attrs>=25.0.0,<26.0.0",
    "certifi>=2025.0.0,<2026.0.0",
    "charset-normalizer>=3.4.0,<4.0.0",
    "colorama>=0.4.6,<1.0.0",
    "distro>=1.9.0,<2.0.0",
    "frozenlist>=1.5.0,<2.0.0",
    "greenlet>=3.1.0,<4.0.0",
    "h11>=0.14.0,<1.0.0",
    "httpcore>=1.0.0,<2.0.0",
    "httpx>=0.28.0,<1.0.0",
    "idna>=3.10,<4.0",
    "jiter>=0.8.0,<1.0.0",
    "jsonpatch>=1.33,<2.0.0",
    "jsonpointer>=3.0.0,<4.0.0",
    "langchain>=0.3.18,<1.0.0",
    "langchain-core>=0.3.34,<1.0.0",
    "langchain-openai>=0.3.4,<1.0.0",
    "langchain-text-splitters>=0.3.6,<1.0.0",
    "langgraph>=0.2.70,<1.0.0",
    "langgraph-checkpoint>=2.0.10,<3.0.0",
    "langgraph-sdk>=0.1.51,<1.0.0",
    "langsmith>=0.3.7,<1.0.0",
    "lxml>=5.3.0,<6.0.0",
    "msgpack>=1.1.0,<2.0.0",
    "multidict>=6.1.0,<7.0.0",
    "nest-asyncio>=1.6.0,<2.0.0",
    "numpy>=2.2.0,<3.0.0",
    "openai>=1.61.0,<2.0.0",
    "orjson>=3.10.15,<4.0.0",
    "packaging>=24.2,<25.0.0",
    "pillow>=11.1.0,<12.0.0",
    "playwright>=1.50.0,<2.0.0",
    "propcache>=0.2.1,<1.0.0",
    "pydantic>=2.10.6,<3.0.0",
    "pydantic-core>=2.27.2,<3.0.0",
    "pyee>=12.1.1,<13.0.0",
    "PyYAML>=6.0.2,<7.0.0",
    "regex>=2024.11.6,<2025.0.0",
    "requests>=2.32.3,<3.0.0",
    "requests-toolbelt>=1.0.0,<2.0.0",
    "sniffio>=1.3.1,<2.0.0",
    "SQLAlchemy>=2.0.38,<3.0.0",
    "tenacity>=9.0.0,<10.0.0",
    "tiktoken>=0.8.0,<1.0.0",
    "tqdm>=4.67.1,<5.0.0",
    "typing-extensions>=4.12.2,<5.0.0",
    "urllib3>=2.3.0,<3.0.0",
    "yarl>=1.18.3,<2.0.0",
    "zstandard>=0.23.0,<1.0.0",
    "langchainhub>=0.1.21,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "pytest-mock>=3.14.0,<4.0.0",
    "black>=24.10.0,<25.0.0",
    "ruff>=0.7.0,<1.0.0",
    "mypy>=1.13.0,<2.0.0",
    "types-requests>=2.32.0,<3.0.0",
    "pre-commit>=3.8.0,<4.0.0",
]
web = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn>=0.30.0,<1.0.0",
    "streamlit>=1.40.0,<2.0.0",
    "websockets>=13.1,<14.0",
    "python-multipart>=0.0.9,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/DonGuillotine/langraph_browser_agent"
Repository = "https://github.com/DonGuillotine/langraph_browser_agent"
Issues = "https://github.com/DonGuillotine/langraph_browser_agent/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
    "browser: Tests requiring browser",
]

[tool.ruff]
line-length = 100
target-version = "py312"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function calls in default arguments
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106"]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.venv
  | venv
  | __pycache__
  | \.pytest_cache
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true
pretty = true
ignore_missing_imports = true
exclude = [
    "tests/",
    "web_ui/",
]

[[tool.mypy.overrides]]
module = [
    "langchain*",
    "langgraph*",
    "playwright*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "web_ui/*",
    "*/site-packages/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = true

[tool.pre-commit]
fail_fast = true

[tool.poetry]
name = "langraph-browser-agent"
version = "1.0.0"
description = "Vision-enabled web browsing agent powered by LLMs"
authors = ["Langraph Browser Agent Contributors <infect3dlab@gmail.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/DonGuillotine/langraph_browser_agent"
homepage = "https://github.com/DonGuillotine/langraph_browser_agent"
keywords = ["browser", "automation", "llm", "langchain", "langgraph", "playwright", "ai-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
packages = [{include = "*", from = "."}]